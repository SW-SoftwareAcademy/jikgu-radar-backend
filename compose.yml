services:
  postgres:
    image: postgres:16-alpine
    container_name: jikgu-radar-postgres
    environment:
      POSTGRES_DB: jikgu_radar
      POSTGRES_USER: jikgu_radar
      POSTGRES_PASSWORD: jikgu_radar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jikgu_radar -d jikgu_radar"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:

